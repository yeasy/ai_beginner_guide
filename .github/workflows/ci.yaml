name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, build, and verify editions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record source integrity
        run: echo "EXPECTED_README_SHA=$(sha256sum README.md | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Install Chromium
        id: setupchrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable

      - name: Install document tools and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra pandoc poppler-utils

      - name: Resolve latest mdPress release
        run: |
          url="$(curl -fsSL --retry 3 -o /dev/null -w '%{url_effective}' https://github.com/yeasy/mdPress/releases/latest)"
          version="${url##*/v}"
          test -n "$version" || { echo "could not resolve latest mdPress release"; exit 1; }
          echo "MDPRESS_VERSION=$version" >> "$GITHUB_ENV"
          echo "resolved mdPress $version"
      - name: Install mdPress (checksum-verified)
        run: |
          archive="/tmp/mdpress_${MDPRESS_VERSION}_linux_amd64.tar.gz"
          extract_dir="$(mktemp -d)"
          curl -fsSL "https://github.com/yeasy/mdPress/releases/download/v${MDPRESS_VERSION}/mdpress_${MDPRESS_VERSION}_linux_amd64.tar.gz" -o "$archive"
          expected="$(curl -fsSL --retry 3 "https://github.com/yeasy/mdPress/releases/download/v${MDPRESS_VERSION}/checksums.txt" \
            | awk -v f="mdpress_${MDPRESS_VERSION}_linux_amd64.tar.gz" '$2==f {print $1}')"
          test -n "$expected" || { echo "no published checksum for mdpress_${MDPRESS_VERSION}_linux_amd64.tar.gz"; exit 1; }
          echo "${expected}  $archive" | sha256sum -c -
          tar --extract --gzip --file "$archive" --directory "$extract_dir" mdpress
          sudo install -m 0755 "$extract_dir/mdpress" /usr/local/bin/mdpress
          echo "${EXPECTED_README_SHA}  README.md" | sha256sum -c -
          mdpress --version

      - name: Install locked Mermaid CLI
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          npm ci --prefix tools/mermaid --ignore-scripts
          echo "$GITHUB_WORKSPACE/tools/mermaid/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run project and lab tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 check_project_rules.py && python3 check_emphasis.py

      - name: Build PDF and HTML editions
        run: |
          # mdPress PDF generation drives headless Chrome, which intermittently dies with
          # "websocket url timeout reached" + dbus errors. Retry the build, not the whole job.
          mdpress() { local a; for a in 1 2 3; do command mdpress "$@" && return 0;
            echo "::warning::mdpress attempt $a failed; retrying in 10s"; sleep 10; done; return 1; }
          mkdir -p dist /tmp/mmsvg
          mdpress build --format pdf --output dist/ai_beginner_guide.pdf
          if ! timeout --signal=TERM 8m python3 tools/render_mermaid.py --book-dir . --svg-out /tmp/mmsvg --strict; then
            echo "::error::Mermaid rendering failed — refusing to publish an edition with raw diagram source."
            exit 1
          fi
          python3 tools/build_html_reader.py --book-dir . --title "零基础学 AI" \
            --svg-dir /tmp/mmsvg --out dist/ai_beginner_guide.html

      - name: Verify source and built artifacts
        run: |
          python3 tools/verify_artifacts.py \
            --readme README.md \
            --expected-readme-sha "$EXPECTED_README_SHA" \
            --pdf dist/ai_beginner_guide.pdf \
            --html dist/ai_beginner_guide.html
          (cd dist && sha256sum ai_beginner_guide.pdf ai_beginner_guide.html > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Upload verified editions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai_beginner_guide-editions
          path: |
            dist/ai_beginner_guide.pdf
            dist/ai_beginner_guide.html
            dist/SHA256SUMS
          if-no-files-found: error
